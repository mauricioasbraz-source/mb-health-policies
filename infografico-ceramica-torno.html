<title>Torno em 13 Etapas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Commissioner:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: um "mostrador" circular com as 13 etapas no aro; no centro, o corte lateral da argila muda de forma a cada etapa. Ao lado, o texto da etapa. Abaixo, a ficha completa. */
:root{
  --bg:#EDF0F2; --surface:#F8FAFB; --ink:#1C2330; --muted:#586272; --line:#C8CFD6;
  --cobalt:#2B4A9E; --cobalt-soft:#D6DEF2; --clay:#9B9086; --clay-dark:#6E645B; --slip:#C3BAB0;
  --display:"Gloock", "Georgia", serif;
  --body:"Commissioner", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151C; --surface:#181E27; --ink:#E5E9EE; --muted:#98A2B0; --line:#2C3441;
  --cobalt:#93ABF2; --cobalt-soft:#24304D; --clay:#A89C8F; --clay-dark:#7A6F64; --slip:#5A534C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#181E27; --ink:#E5E9EE; --muted:#98A2B0; --line:#2C3441;
  --cobalt:#93ABF2; --cobalt-soft:#24304D; --clay:#A89C8F; --clay-dark:#7A6F64; --slip:#5A534C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--cobalt)}
.byline{font-family:var(--mono);font-size:.8rem;color:var(--muted);letter-spacing:.04em}

.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.dial{width:100%;max-width:600px;margin:0 auto;aspect-ratio:1}
.dial svg{width:100%;height:100%;display:block;overflow:visible}

.ring-rot{transition:transform .7s cubic-bezier(.6,.05,.25,1);transform-origin:300px 300px}
.marker{cursor:pointer}
.marker circle{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:fill .3s,stroke .3s}
.marker text{font-family:var(--mono);font-size:15px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.marker:hover circle{stroke:var(--cobalt)}
.marker.on circle{fill:var(--cobalt);stroke:var(--cobalt)}
.marker.on text{fill:var(--surface);font-weight:500}
.marker:focus{outline:none}
.marker:focus-visible circle{stroke:var(--cobalt);stroke-width:3}
.phase-arc{fill:none;stroke-width:8;stroke-linecap:round}
.phase-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;fill:var(--muted);text-transform:uppercase}
.loop{fill:none;stroke:var(--cobalt);stroke-width:1.4;stroke-dasharray:3 3}
.loop-head{fill:var(--cobalt)}

.head{fill:var(--clay-dark)}
.spin{stroke:var(--surface);stroke-width:3;stroke-dasharray:6 18;opacity:.55;animation:spin 1s linear infinite}
.spin.slow{animation-duration:3.2s}
.spin.stop{animation:none}
@keyframes spin{to{stroke-dashoffset:-48}}
.clay{fill:var(--clay)}
.rings{stroke:var(--clay-dark);stroke-width:.8;opacity:.35}
.arrow{stroke:var(--cobalt);stroke-width:3;fill:none;stroke-linecap:round}
.arrow-h{fill:var(--cobalt)}
.dim{stroke:var(--muted);stroke-width:1}
.dim-t{font-family:var(--mono);font-size:12px;fill:var(--muted)}
.cut{stroke:var(--cobalt);stroke-width:2;stroke-dasharray:5 4}
.axis{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
.center-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;fill:var(--muted);text-anchor:middle;text-transform:uppercase}

.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt)}
.num{font-family:var(--display);font-size:5.5rem;line-height:.8;color:var(--cobalt)}
.titlerow{display:flex;align-items:flex-end;gap:18px}
.panel h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.08;margin:0;text-wrap:balance}
.panel .text{max-width:62ch;margin:0;display:flex;flex-direction:column;gap:10px}
.panel .text p{margin:0}
.panel .text b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.76rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.chip.k{border-color:var(--cobalt);color:var(--cobalt)}
.chip button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.chip button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav button{font:500 .9rem var(--body);padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.nav button:hover:not(:disabled){border-color:var(--cobalt);color:var(--cobalt)}
.nav button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.nav button:disabled{opacity:.4;cursor:default}
.nav .hint{font-family:var(--mono);font-size:.74rem;color:var(--muted)}

.sheet{border-top:1px solid var(--line);padding-top:28px;display:flex;flex-direction:column;gap:20px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0}
.sheet ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 32px}
.sheet li{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:6px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sheet li:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.sheet li.on .n,.sheet li.on .t{color:var(--cobalt)}
.sheet .n{font-family:var(--mono);color:var(--muted);font-size:.85rem;padding-top:2px}
.sheet .t{font-weight:600}
.sheet .d{grid-column:2;color:var(--muted);font-size:.9rem;line-height:1.5}
.sheet .ph{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cobalt);grid-column:1/-1;padding-top:14px;border:none;cursor:default}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:baseline}
footer .done{font-family:var(--display);font-size:1.6rem}
footer .done span{color:var(--muted);font-family:var(--body);font-size:1rem;margin-left:8px}
@media (prefers-reduced-motion:reduce){.ring-rot{transition:none}.spin{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>Cerâmica no torno<br>em <em>13 etapas</em></h1>
    <div class="byline">POR MAURICIO BRAZ · @mauriciobraz.ceramica</div>
  </header>

  <section class="stage" aria-label="Etapas interativas">
    <div class="dial">
      <svg viewBox="0 0 600 600" role="img" aria-labelledby="dialTitle">
        <title id="dialTitle">Mostrador com as 13 etapas e o corte da peça na etapa atual</title>
        <defs>
          <clipPath id="above"><rect x="0" y="0" width="600" height="400"/></clipPath>
          <pattern id="throw" width="12" height="9" patternUnits="userSpaceOnUse">
            <line x1="0" y1="4.5" x2="12" y2="4.5" class="rings"/>
          </pattern>
          <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="arrow-h"/>
          </marker>
          <marker id="lh" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="loop-head"/>
          </marker>
        </defs>
        <g id="ring" class="ring-rot"></g>
        <!-- corte lateral -->
        <line x1="300" y1="160" x2="300" y2="430" class="axis"/>
        <g clip-path="url(#above)">
          <path id="clay" class="clay"/>
          <path id="clayTex" fill="url(#throw)"/>
        </g>
        <g id="ann"></g>
        <rect x="158" y="400" width="284" height="14" rx="3" class="head"/>
        <line x1="164" y1="407" x2="436" y2="407" id="spin" class="spin"/>
        <rect x="288" y="414" width="24" height="26" class="head"/>
        <text x="300" y="462" class="center-lbl" id="rpm">rotação · normal</text>
      </svg>
    </div>

    <div class="panel" aria-live="polite">
      <div class="eyebrow" id="phase">Preparação</div>
      <div class="titlerow"><div class="num" id="num">1</div><h2 id="title"></h2></div>
      <div class="text" id="text"></div>
      <div class="chips" id="chips"></div>
      <div class="nav">
        <button id="prev" type="button">← Anterior</button>
        <button id="next" type="button">Próxima →</button>
        <span class="hint">ou use as setas do teclado</span>
      </div>
    </div>
  </section>

  <section class="sheet" aria-label="Ficha completa">
    <h3>Ficha completa</h3>
    <ol id="list"></ol>
  </section>

  <footer>
    <div class="done">Parabéns, peça pronta! <span>Agora limpe o torno.</span></div>
    <div class="byline">Desenhos em corte, fora de escala.</div>
  </footer>
</div>

<script>
const PHASES=[
  {name:"Preparação",from:1,to:1},
  {name:"Centragem",from:2,to:4},
  {name:"Abertura",from:5,to:7},
  {name:"Paredes",from:8,to:10},
  {name:"Acabamento",from:11,to:13}
];
// perfis: metade direita do corte, 12 pontos [raio, altura] em cm (ilustrativos)
const ball=[[0,0],[2.5,.6],[4.3,2.2],[5,4.5],[4.6,6.6],[3.6,8.2],[2.4,9.2],[1.6,9.5],[1.1,9.7],[.7,9.8],[.35,9.85],[0,9.9]];
const dome=[[0,0],[6,0],[6.2,1],[5.9,2.6],[5.2,4],[4.2,5.1],[3,5.8],[2.2,6.1],[1.5,6.3],[.9,6.4],[.4,6.45],[0,6.5]];
const cone=[[0,0],[4.6,0],[4.4,1.5],[3.8,3.5],[3.1,5.6],[2.4,7.6],[1.7,9.4],[1.2,10.4],[.8,11],[.5,11.4],[.25,11.6],[0,11.7]];
const cent=[[0,0],[5.2,0],[5.3,1],[5.2,2.5],[5,3.8],[4.7,4.8],[4.1,5.4],[3,5.6],[2,5.65],[1.2,5.7],[.6,5.7],[0,5.7]];
const hole=[[0,0],[5.2,0],[5.3,1],[5.2,2.5],[5,3.8],[4.7,4.8],[4.1,5.4],[2.2,5.6],[1.1,5.4],[.9,4],[.7,1.5],[0,1.2]];
const open=[[0,0],[5.4,0],[5.6,1],[5.6,2.5],[5.5,3.8],[5.3,4.7],[5,5.1],[4.2,5],[3.6,4.2],[3.1,1.9],[2,1.3],[0,1.2]];
const floor=[[0,0],[5.4,0],[5.6,1],[5.6,2.5],[5.5,3.8],[5.3,4.7],[5,5.1],[4.2,5],[3.7,4],[3.5,1.4],[2.5,1.1],[0,1.1]];
const wall90=[[0,0],[5.4,0],[5.4,1],[5.4,2.5],[5.4,3.8],[5.4,4.8],[5.3,5.4],[3.9,5.4],[3.8,4.5],[3.8,1.3],[3.4,1.1],[0,1.1]];
const tall=[[0,0],[4.4,0],[4.5,1],[4.4,4],[4.3,7],[4.2,10],[4.2,12.6],[3.6,12.6],[3.65,9],[3.75,1.4],[3.3,1.1],[0,1.1]];
const vase=[[0,0],[3.6,0],[4.6,1.8],[5.6,4.5],[5.2,8],[3.4,10.8],[3.8,12.8],[3.3,12.8],[2.95,10.8],[4.9,4.6],[2.9,1.15],[0,1.1]];

const STEPS=[
 {t:"Organize o espaço e sove a argila",p:ball,rpm:"stop",
  d:["Visualize ou desenhe a forma que deseja criar. Organize as ferramentas necessárias, água e um local para descansar a peça pronta.","Sove a quantidade adequada de argila, modelando uma bola ou cone sem bolhas de ar."],
  chips:[["Sem bolhas de ar"]],arrows:[]},
 {t:"Fixe a argila no centro do torno",p:dome,
  d:["A partir daqui, <b>mãos sempre molhadas e cotovelos apoiados</b>.","Com uma mão pressione de cima para baixo e com a outra, firme na lateral, modele a argila em forma de meia bola, bem fixada ao disco."],
  chips:[["Mãos molhadas","k"],["Cotovelos apoiados","k"]],arrows:[[0,9,0,7],[8.6,3,6.6,3]]},
 {t:"Compacte a argila",p:cone,sub:"2 partes",
  d:["<b>Parte 1:</b> com ao menos um cotovelo apoiado, abrace a argila deixando espaço entre os punhos. Pressione em baixo uma mão contra a outra em direção ao centro, e a massa irá subir. Guie esse movimento até a ponta formando um cone. Se formar um “vulcão”, pressione o topo formando um cone e recomece.","<b>Parte 2:</b> com uma mão em concha no topo e a outra na base ou logo abaixo, empurre o topo levemente para frente e para baixo, voltando à forma de meia bola.","Repita as Partes 1 e 2 ao menos 3 vezes."],
  chips:[["Repita ao menos 3×","k"]],arrows:[[7,1.5,5.2,1.5],[-7,1.5,-5.2,1.5],[2.2,5,1.2,9.5]]},
 {t:"Centralize a massa",p:cent,
  d:["Leve a argila completamente para o centro com firmeza, alinhando o topo e as laterais ao eixo do torno. Uma mão domina o topo e a outra a base.","Se suas mãos balançarem ou a massa oscilar visualmente, repita ou retorne ao passo 3."],
  chips:[["Oscilou? volte ao passo 3",null,3]],arrows:[[-2.5,8.6,-2.5,6.4],[8,2,5.9,2]]},
 {t:"Faça o furo",p:hole,
  d:["Com os polegares unidos, pressione exatamente no centro da massa. Lubrifique durante o processo.","Pare ao alcançar 1 cm ou mais de espessura de fundo. Verifique com uma agulha, com os dedos ou visualmente."],
  chips:[["Fundo ≥ 1 cm","k"],["Lubrifique"]],arrows:[[0,8.5,0,5.2]],floor:true},
 {t:"Abra a massa",p:open,
  d:["Com as mãos dentro do furo, abra de dentro para fora em sincronia com a rotação do torno.","Mantenha pressão constante e cuide para que o fundo fique com espessura nivelada."],
  chips:[["Pressão constante"]],arrows:[[1,2.6,3.2,2.6],[-1,2.6,-3.2,2.6]]},
 {t:"Compacte o fundo",p:floor,rpm:"slow",
  d:["Reduza a rotação do torno.","Com o dedo, esponja ou ferramenta, faça movimentos lentos da borda para o centro (e o contrário), repetidamente, para compactar e nivelar bem o fundo."],
  chips:[["Rotação reduzida","k"]],arrows:[[3,1.9,.4,1.9],[.4,1.9,3,1.9]]},
 {t:"Forme paredes em 90º",p:wall90,
  d:["Com uma mão por dentro e outra por fora, pressione toda a parede formando um ângulo reto entre o fundo e as paredes interna e externa."],
  chips:[["Ângulo de 90º","k"]],arrows:[[2.2,3,3.6,3],[7.6,3,5.6,3]],right:true},
 {t:"Suba a parede",p:tall,
  d:["Com a argila bem lubrificada, aperte a parede desde a base até o topo com uma mão e use a outra do outro lado da parede como apoio. Isso vai fazer a massa subir.","Repita quantas vezes for necessário, ajustando a pressão para controlar e igualar a espessura ao longo de toda a parede."],
  chips:[["Lubrifique"],["Repita o necessário","k"]],arrows:[[5.4,1.5,5.4,11.5]]},
 {t:"Dê forma à peça",p:vase,
  d:["Com as mãos e/ou ferramentas, modele a peça com movimentos delicados de dentro para fora (ou vice-versa), puxando, empurrando, enforcando ou repetindo o passo 9 com variações.","Respeite a velocidade do torno para que a pressão seja igual em toda a volta."],
  chips:[["Pode repetir o passo 9",null,9]],arrows:[[3.4,4.6,4.6,4.6],[5.4,10.8,3.8,10.8]]},
 {t:"Seque a parte externa",p:vase,
  d:["Use esponja ou ferramenta em movimentos ascendentes para secar a parte de fora, apoiando com uma mão por dentro.","Se a peça for fechada e você não puder colocar a mão dentro, faça primeiro o passo 12."],
  chips:[["Peça fechada? faça antes o 12",null,12]],arrows:[[6.6,1.5,6.6,9]]},
 {t:"Seque a parte interna",p:vase,
  d:["Com cuidado, use esponja ou ferramenta para secar o interior.","Como não haverá apoio externo (a menos que use ferramentas dos dois lados), seja muito delicado para preservar a forma."],
  chips:[["Muito delicado","k"]],arrows:[[3.4,2,4.2,7.5]]},
 {t:"Solte a peça do torno",p:vase,cut:true,
  d:["Use linha de nylon, arame ou cabo de aço para cortar a base da peça. Passe a linha entre a peça e o prato do torno, num movimento firme e contínuo.","Jogue um pouco de água no prato e passe a linha novamente, lubrificando o espaço criado.","Leve a peça até a borda do prato, encaixe as pontas dos dedos sob o fundo, uma de cada vez, e levante a peça com segurança. Coloque-a no local escolhido: primeiro a base, depois retire a mão com agilidade para preservar a forma."],
  chips:[["Linha 2× com água","k"],["Base primeiro"]],arrows:[]}
];
// voltas no processo (de → para), desenhadas fora do aro
const LOOPS=[[4,3],[10,9],[11,12]];
const SELF=[3,9];

const NS="http://www.w3.org/2000/svg", C=300, R=262, S=15, BASE=400;
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const ang=i=>(i-1)/13*360; // graus, 0 = topo
const pol=(deg,r)=>{const a=(deg-90)*Math.PI/180;return[C+r*Math.cos(a),C+r*Math.sin(a)]};
const ring=document.getElementById("ring");

// arcos das fases
const phaseColors=[.35,.55,.75,.9,1];
PHASES.forEach((ph,k)=>{
  const a0=ang(ph.from)-11,a1=ang(ph.to)+11;
  const [x0,y0]=pol(a0,R),[x1,y1]=pol(a1,R);
  el("path",{d:`M${x0} ${y0} A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`,class:"phase-arc",stroke:"var(--cobalt)","stroke-opacity":phaseColors[k]*.45},ring);
});
// voltas
LOOPS.forEach(([a,b])=>{
  const r=R+30,[x0,y0]=pol(ang(a),r),[x1,y1]=pol(ang(b),r);
  const sweep=b>a?1:0;
  el("path",{d:`M${x0} ${y0} A${r} ${r} 0 0 ${sweep} ${x1} ${y1}`,class:"loop","marker-end":"url(#lh)"},ring);
});
SELF.forEach(i=>{
  const [x,y]=pol(ang(i),R+34);const g=el("g",{transform:`translate(${x} ${y}) rotate(${ang(i)})`},ring);
  el("path",{d:"M-7 6 C-14 -10 14 -10 7 6",class:"loop","marker-end":"url(#lh)"},g);
});
// marcadores
const markers=STEPS.map((s,i)=>{
  const n=i+1,[x,y]=pol(ang(n),R);
  const g=el("g",{class:"marker",tabindex:0,role:"button","aria-label":`Etapa ${n}: ${s.t}`},ring);
  el("circle",{cx:x,cy:y,r:19},g);
  const t=el("text",{x,y},g);t.textContent=n;
  g.addEventListener("click",()=>go(n));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go(n)}});
  return {g,t,x,y};
});

// corte da argila
function full(p){const R=p.map(([x,y])=>[C+x*S,BASE-y*S]);const L=p.slice(1,11).reverse().map(([x,y])=>[C-x*S,BASE-y*S]);return R.concat(L)}
function smooth(pts){
  const n=pts.length;let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}
  return d+"Z";
}
const clay=document.getElementById("clay"),tex=document.getElementById("clayTex"),ann=document.getElementById("ann");
let shown=STEPS[0].p.map(q=>q.slice()),anim=null;
function draw(p){const d=smooth(full(p));clay.setAttribute("d",d);tex.setAttribute("d",d)}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function morph(target){
  cancelAnimationFrame(anim);const from=shown.map(q=>q.slice()),t0=performance.now(),dur=reduce?0:650;
  const tick=now=>{const k=dur?Math.min(1,(now-t0)/dur):1,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    shown=from.map((q,i)=>[q[0]+(target[i][0]-q[0])*e,q[1]+(target[i][1]-q[1])*e]);draw(shown);
    if(k<1)anim=requestAnimationFrame(tick)};
  anim=requestAnimationFrame(tick);
}
const X=x=>C+x*S,Y=y=>BASE-y*S;
function annotate(s){
  ann.innerHTML="";
  s.arrows.forEach(([x1,y1,x2,y2])=>el("line",{x1:X(x1),y1:Y(y1),x2:X(x2),y2:Y(y2),class:"arrow","marker-end":"url(#ah)"},ann));
  const h=Math.max(...s.p.map(q=>q[1]));
  const dx=X(7.6);
  el("line",{x1:dx,y1:Y(0),x2:dx,y2:Y(h),class:"dim"},ann);
  [0,h].forEach(v=>el("line",{x1:dx-5,y1:Y(v),x2:dx+5,y2:Y(v),class:"dim"},ann));
  const tt=el("text",{x:dx+9,y:(Y(0)+Y(h))/2,class:"dim-t","dominant-baseline":"central"},ann);tt.textContent=`≈${Math.round(h)} cm`;
  if(s.floor){const fx=X(-3.2);
    el("line",{x1:fx,y1:Y(0),x2:fx,y2:Y(1.2),class:"dim"},ann);
    const ft=el("text",{x:fx-8,y:Y(.6),class:"dim-t","text-anchor":"end","dominant-baseline":"central"},ann);ft.textContent="≥1 cm";}
  if(s.right){[1,-1].forEach(sg=>el("path",{d:`M${C+sg*3.8*S-sg*10} ${Y(1.1)} v-10 h${sg*10}`,fill:"none",stroke:"var(--cobalt)","stroke-width":1.6},ann));}
  if(s.cut){el("line",{x1:130,y1:BASE-1,x2:470,y2:BASE-1,class:"cut"},ann);
    const ct=el("text",{x:470,y:BASE-10,class:"dim-t","text-anchor":"end"},ann);ct.textContent="linha de corte";}
}

// painel e ficha
const $=id=>document.getElementById(id);
const list=$("list");const items=[];
PHASES.forEach(ph=>{
  const h=document.createElement("li");h.className="ph";h.textContent=ph.name;h.setAttribute("aria-hidden","true");list.appendChild(h);
  for(let n=ph.from;n<=ph.to;n++){const s=STEPS[n-1];const li=document.createElement("li");li.tabIndex=0;
    li.innerHTML=`<span class="n">${String(n).padStart(2,"0")}</span><span class="t">${s.t}${s.sub?` <span style="font-weight:400;color:var(--muted)">(${s.sub})</span>`:""}</span><span class="d">${s.d.join(" ")}</span>`;
    li.addEventListener("click",()=>{go(n);document.querySelector(".stage").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})});
    li.addEventListener("keydown",e=>{if(e.key==="Enter"){li.click()}});
    list.appendChild(li);items[n]=li;}
});
const phaseOf=n=>PHASES.find(p=>n>=p.from&&n<=p.to).name;
let cur=1,turn=0;
function go(n){
  n=Math.max(1,Math.min(13,n));
  // gira o aro pelo caminho mais curto para a etapa ficar no topo
  let target=-ang(n),diff=((target-turn)%360+540)%360-180;turn+=diff;
  ring.style.transform=`rotate(${turn}deg)`;
  markers.forEach((m,i)=>{m.g.classList.toggle("on",i+1===n);m.t.setAttribute("transform",`rotate(${-turn} ${m.x} ${m.y})`)});
  const s=STEPS[n-1];cur=n;
  $("num").textContent=n;$("phase").textContent=`${phaseOf(n)} · etapa ${n} de 13`;
  $("title").innerHTML=s.t+(s.sub?` <span style="color:var(--muted);font-size:.6em">(${s.sub})</span>`:"");
  $("text").innerHTML=s.d.map(x=>`<p>${x}</p>`).join("");
  const ch=$("chips");ch.innerHTML="";
  s.chips.forEach(([label,k,link])=>{const c=document.createElement("span");c.className="chip"+(k?" k":"");
    if(link){const b=document.createElement("button");b.type="button";b.textContent=label;b.onclick=()=>go(link);c.appendChild(b)}else c.textContent=label;ch.appendChild(c)});
  const rpm=s.rpm||"run";$("spin").setAttribute("class","spin"+(rpm==="slow"?" slow":rpm==="stop"?" stop":""));
  $("rpm").textContent="rotação · "+(rpm==="slow"?"reduzida":rpm==="stop"?"parado":"normal");
  $("prev").disabled=n===1;$("next").disabled=n===13;
  items.forEach((li,i)=>li&&li.classList.toggle("on",i===n));
  morph(s.p);annotate(s);
}
$("prev").onclick=()=>go(cur-1);$("next").onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();go(cur+1)}
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();go(cur-1)}});
draw(shown);go(1);
</script>
